worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No URL, query, authorization header, or content is written to access logs.
    log_format downloads '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout downloads;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    gzip off;
    etag on;
    max_ranges 1;
    keepalive_timeout 20s;
    send_timeout 120s;

    server {
        listen 8080;
        root /srv;
        autoindex off;
        disable_symlinks on;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /updates/agentatelier/healthz {
            add_header Cache-Control 'no-store' always;
            limit_except GET { deny all; }
            default_type text/plain;
            return 200 'agentatelier-updates ready\n';
        }
        # Hidden files, key/config exports and private staging never become downloads.
        location ~ /\. { return 404; }
        location ~* \.(pem|key|env|sqlite|bak|tmp|part)$ { return 404; }
        location ~* /(?:private|staging|backups|secrets)(?:/|$) { return 404; }
        location /updates/agentatelier/channels/ {
            add_header Cache-Control 'no-store' always;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/updates/agentatelier/(?:releases|resources|artifacts|notes)/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location /updates/agentatelier/diagnostics/ {
            add_header Cache-Control 'no-store' always;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
