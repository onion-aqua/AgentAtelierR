        # BEGIN agentatelier-updates (managed by deploy_update_server.py)
        location = /updates/agentatelier { return 308 /updates/agentatelier/; }
        location ^~ /updates/agentatelier/ {
            set $updates_upstream http://agentatelier-updates:8080;
            proxy_pass $updates_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect off;
            proxy_intercept_errors off;
            limit_except GET { deny all; }
        }
        # END agentatelier-updates
