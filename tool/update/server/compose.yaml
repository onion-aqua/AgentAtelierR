name: agentatelier-updates
services:
  static:
    image: ${UPDATE_NGINX_IMAGE:?Set an installed immutable nginx digest}
    user: '101:101'
    entrypoint: ['nginx']
    command: ['-g', 'daemon off;', '-c', '/etc/nginx/nginx.conf']
    restart: unless-stopped
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=700
    volumes:
      - /opt/agentatelier-updates/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/agentatelier-updates/public:/srv/updates/agentatelier:ro
    networks:
      edge:
        aliases: ['agentatelier-updates']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/updates/agentatelier/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
networks:
  edge:
    external: true
    name: ${UPDATE_EDGE_NETWORK:?Set the existing edge network}
